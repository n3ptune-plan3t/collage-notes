name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - "collage-notes.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # older glibc = binary runs on more distros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libs (Qt xcb/wayland runtime deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libcups2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --noconfirm --name collage-notes \
            --exclude-module PySide6 \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtMultimediaWidgets \
            --exclude-module PyQt6.QtTextToSpeech \
            --exclude-module PyQt6.QtSpatialAudio \
            --exclude-module PyQt6.QtNfc \
            --exclude-module PyQt6.QtSql \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtWebSockets \
            --exclude-module PyQt6.QtWebChannel \
            --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtSensors \
            --exclude-module PyQt6.QtSerialPort \
            collage-notes.py
          strip dist/collage-notes || true
          cd dist
          tar czf collage-notes-linux-x86_64.tar.gz collage-notes
          sha256sum collage-notes collage-notes-linux-x86_64.tar.gz > SHA256SUMS

      - name: Compute auto tag
        id: tag
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create tag & release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: collage-notes ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/collage-notes
            dist/collage-notes-linux-x86_64.tar.gz
            dist/SHA256SUMS
